services:
  - type: web
    name: resqgrid
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m uvicorn main:app --app-dir backend_py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      # (Optional) Add GEMINI_API_KEY in Render dashboard environment settings
